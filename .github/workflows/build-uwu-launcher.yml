name: Build uwuAOSP Launcher3QuickStep (Android 17)

on:
  push:
  workflow_dispatch:
    inputs:
      uwu_ref:
        description: "uwuAOSP Launcher3 commit/tag/branch"
        required: true
        default: "263331a9f9701a7ee1e74be5b95b68bb2153ad7e"
        type: string
      build_type:
        description: "Gradle build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Gradle build harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            https://github.com/yuchuangu85/Launcher3.git \
            launcher3-build

      - name: Fetch exact uwuAOSP Launcher3 source
        shell: bash
        env:
          UWU_REF: ${{ inputs.uwu_ref || '263331a9f9701a7ee1e74be5b95b68bb2153ad7e' }}
        run: |
          set -euo pipefail

          git init uwu-launcher3
          cd uwu-launcher3

          git remote add origin \
            https://github.com/uwuAOSP/platform_packages_apps_Launcher3.git

          git fetch --depth=1 origin "$UWU_REF"
          git checkout --detach FETCH_HEAD

          echo "UWU_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail

          echo "uwuAOSP Launcher3:"
          echo "  SHA: ${UWU_SOURCE_SHA}"

          echo "Gradle build harness:"
          echo "  SHA: $(git -C launcher3-build rev-parse HEAD)"

      - name: Overlay uwuAOSP Launcher3 source
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.git/' \
            uwu-launcher3/ \
            launcher3-build/

      - name: Fix Android 17 manifest for AGP 9
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          # AGP 9 rejects targetSdkVersion/minSdkVersion in the main manifest.
          # Keep tools:overrideLibrary, which remains supported.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("AndroidManifest.xml")
          s = p.read_text()

          old = '<uses-sdk android:targetSdkVersion="33" android:minSdkVersion="30"\n        tools:overrideLibrary="com.kieronquinn.app.smartspacer.sdk.client"/>'

          new = '<uses-sdk tools:overrideLibrary="com.kieronquinn.app.smartspacer.sdk.client"/>'

          if old not in s:
              raise SystemExit(
                  "Expected uwuAOSP <uses-sdk> declaration was not found"
              )

          p.write_text(s.replace(old, new, 1))
          PY

          echo "=== Manifest SDK declaration ==="
          grep -n "uses-sdk" AndroidManifest.xml

      - name: Fix Gradle repositories
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Original Gradle repository configuration ==="

          grep -n -E \
            'maven.aliyun.com|repositories[[:space:]]*\{|google\(\)|mavenCentral\(\)|gradlePluginPortal\(\)' \
            settings.gradle || true

          # Replace unreliable Aliyun mirrors with official repositories.
          sed -i \
            "s#https://maven.aliyun.com/repository/google#OFFICIAL_GOOGLE_REPO#g" \
            settings.gradle

          sed -i \
            "s#https://maven.aliyun.com/repository/central#OFFICIAL_CENTRAL_REPO#g" \
            settings.gradle

          sed -i \
            "s#https://maven.aliyun.com/repository/gradle-plugin#OFFICIAL_GRADLE_PLUGIN_REPO#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_GOOGLE_REPO' }#google()#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_CENTRAL_REPO' }#mavenCentral()#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_GRADLE_PLUGIN_REPO' }#gradlePluginPortal()#g" \
            settings.gradle

          echo
          echo "=== Patched Gradle repository configuration ==="
          cat settings.gradle

          echo
          echo "=== Checking for remaining Aliyun mirrors ==="

          if grep -RIn \
            "maven.aliyun.com/repository" \
            . \
            --exclude-dir=.git \
            --exclude='*.jar' \
            --exclude='*.aar'; then

            echo "ERROR: Aliyun repository reference still exists." >&2
            exit 1
          fi

          echo "No Aliyun Maven repository references remain."

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Android SDK
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          command -v sdkmanager
          sdkmanager --version

          # Android 17 / API 37.
          # GitHub-hosted runners expose the platform as android-37.0.
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

          # AGP/harness expects the canonical android-37 directory.
          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s \
              "$ANDROID_SDK_ROOT/platforms/android-37.0" \
              "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          # Ensure API 37 is not accidentally downgraded.
          sed -i \
            's/compileSdk[[:space:]]*36/compileSdk 37/g' \
            build.gradle

          sed -i \
            's/buildToolsVersion[[:space:]]*"36\.0\.0"/buildToolsVersion "37.0.0"/g' \
            build.gradle

          echo
          echo "=== Android SDK configuration ==="

          grep -nE \
            'compileSdk|buildToolsVersion' \
            build.gradle

          echo
          echo "=== Installed Android platforms ==="

          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo
          echo "=== Installed build-tools ==="

          ls -la "$ANDROID_SDK_ROOT/build-tools"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Generate BuildConfig
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x tools/buildconfig.sh

          mkdir -p generated-src/com/android/launcher3

          tools/buildconfig.sh \
            --pkg com.android.launcher3 \
            --appId com.android.launcher3 \
            > generated-src/com/android/launcher3/BuildConfig.java

          echo "=== Generated BuildConfig ==="

          sed -n '1,120p' \
            generated-src/com/android/launcher3/BuildConfig.java

      - name: Check framework prebuilts
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "framework-android17.jar"
            "SystemUI.jar"
            "SystemUISharedLib.jar"
            "WindowManager-Shell-shared-AOSP.jar"
            "com_android_launcher3_flags_lib.jar"
            "com_android_systemui_flags_lib.jar"
            "com_android_systemui_shared_flags_lib.jar"
            "com_android_window_flags_lib.jar"
            "com_android_wm_shell_flags_lib.jar"
          )

          for f in "${required[@]}"; do
            test -s "prebuilts/framework/$f" || {
              echo "Missing/empty prebuilt: $f" >&2
              exit 1
            }
          done

          echo "=== Framework prebuilts ==="

          ls -lh prebuilts/framework/

      - name: Build Launcher3QuickStep
        working-directory: launcher3-build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
        run: |
          set -euo pipefail

          case "$BUILD_TYPE" in
            Debug)
              TASK="assembleWithquickstepDebug"
              ;;
            Release)
              TASK="assembleWithquickstepRelease"
              ;;
            *)
              echo "Unsupported build type: $BUILD_TYPE" >&2
              exit 2
              ;;
          esac

          echo "Building Gradle task: $TASK"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            "$TASK"

      - name: Show APKs
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="

          find build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-${{ inputs.build_type || 'Release' }}-${{ github.run_number }}
          path: |
            launcher3-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-diagnostics-${{ github.run_number }}
          path: |
            launcher3-build/build/reports/**
            launcher3-build/build/outputs/logs/**
            launcher3-build/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7