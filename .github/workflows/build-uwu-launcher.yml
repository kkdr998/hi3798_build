name: Build uwuAOSP Launcher3QuickStep (Android 17)

on:
  workflow_dispatch:
    inputs:
      uwu_ref:
        description: "uwuAOSP Launcher3 commit/tag/branch"
        required: true
        default: "263331a9f9701a7ee1e74be5b95b68bb2153ad7e"
        type: string
      build_type:
        description: "Gradle build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Gradle build harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/yuchuangu85/Launcher3.git launcher3-build

      - name: Fetch exact uwuAOSP Launcher3 source
        shell: bash
        env:
          UWU_REF: ${{ inputs.uwu_ref }}
        run: |
          set -euo pipefail

          git init uwu-launcher3
          cd uwu-launcher3

          git remote add origin \
            https://github.com/uwuAOSP/platform_packages_apps_Launcher3.git

          git fetch --depth=1 origin "$UWU_REF"
          git checkout --detach FETCH_HEAD

          echo "UWU_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail

          echo "uwuAOSP Launcher3:"
          echo "  SHA: ${UWU_SOURCE_SHA}"

          echo "Gradle build harness:"
          echo "  SHA: $(git -C launcher3-build rev-parse HEAD)"

      - name: Overlay uwuAOSP Launcher3 source
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.git/' \
            uwu-launcher3/ \
            launcher3-build/

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Do NOT use android-actions/setup-android@v3 here.
      # Its default package list still asks for the obsolete SDK "tools" package.
      # GitHub's Ubuntu runner already provides a working sdkmanager.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          command -v sdkmanager
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;37.0.0"

          test -d "$ANDROID_SDK_ROOT/platforms/android-37"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Generate BuildConfig
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x tools/buildconfig.sh

          mkdir -p generated-src/com/android/launcher3

          tools/buildconfig.sh \
            --pkg com.android.launcher3 \
            --appId com.android.launcher3 \
            > generated-src/com/android/launcher3/BuildConfig.java

          sed -n '1,120p' \
            generated-src/com/android/launcher3/BuildConfig.java

      - name: Check framework prebuilts
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "framework-android17.jar"
            "SystemUI.jar"
            "SystemUISharedLib.jar"
            "WindowManager-Shell-shared-AOSP.jar"
            "com_android_launcher3_flags_lib.jar"
            "com_android_systemui_flags_lib.jar"
            "com_android_systemui_shared_flags_lib.jar"
            "com_android_window_flags_lib.jar"
            "com_android_wm_shell_flags_lib.jar"
          )

          for f in "${required[@]}"; do
            test -s "prebuilts/framework/$f" || {
              echo "Missing/empty prebuilt: $f" >&2
              exit 1
            }
          done

          ls -lh prebuilts/framework/

      - name: Build Launcher3QuickStep
        working-directory: launcher3-build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail

          case "$BUILD_TYPE" in
            Debug)
              TASK="assembleWithquickstepDebug"
              ;;
            Release)
              TASK="assembleWithquickstepRelease"
              ;;
            *)
              echo "Unsupported build type: $BUILD_TYPE" >&2
              exit 2
              ;;
          esac

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            "$TASK"

      - name: Show APKs
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          find build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-${{ inputs.build_type }}-${{ github.run_number }}
          path: |
            launcher3-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-diagnostics-${{ github.run_number }}
          path: |
            launcher3-build/build/reports/**
            launcher3-build/build/outputs/logs/**
            launcher3-build/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7
