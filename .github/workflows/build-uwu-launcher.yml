name: Build uwuAOSP Launcher3QuickStep (Android 17)

on:
  push:
  workflow_dispatch:
    inputs:
      uwu_ref:
        description: "uwuAOSP Launcher3 commit/tag/branch"
        required: true
        default: "263331a9f9701a7ee1e74be5b95b68bb2153ad7e"
        type: string
      build_type:
        description: "Gradle build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Debug
          - Release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout pinned Gradle build harness
        shell: bash
        run: |
          set -euo pipefail

          HARNESS_SHA="39c232d7e4166daebee06f9e3961c5edd1cc6a15"

          git init launcher3-build
          cd launcher3-build

          git remote add origin \
            https://github.com/yuchuangu85/Launcher3.git

          git fetch --depth=1 origin "$HARNESS_SHA"
          git checkout --detach FETCH_HEAD

          echo "HARNESS_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch exact uwuAOSP Launcher3 source
        shell: bash
        env:
          UWU_REF: ${{ inputs.uwu_ref || '263331a9f9701a7ee1e74be5b95b68bb2153ad7e' }}
        run: |
          set -euo pipefail

          git init uwu-launcher3
          cd uwu-launcher3

          git remote add origin \
            https://github.com/uwuAOSP/platform_packages_apps_Launcher3.git

          git fetch --depth=1 origin "$UWU_REF"
          git checkout --detach FETCH_HEAD

          echo "UWU_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify source revisions
        shell: bash
        run: |
          set -euo pipefail

          echo "=== uwuAOSP Launcher3 ==="
          echo "SHA: ${UWU_SOURCE_SHA}"

          echo
          echo "=== Gradle build harness ==="
          echo "SHA: ${HARNESS_SOURCE_SHA}"

      - name: Overlay uwuAOSP Launcher3 source
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude='.git/' \
            uwu-launcher3/ \
            launcher3-build/

      - name: Audit uwuAOSP source before compatibility patches
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Required uwuAOSP resources/source ==="

          required_paths=(
            "res/values/uwu_dimens.xml"
            "res/xml/uwu_device_profiles.xml"
            "res/layout/hotseat_page.xml"
            "res/values/strings.xml"
            "modules/widgetpicker/res"
            "smartspacer/sdk-core/src/main/aidl"
            "smartspacer/sdk-client/soong"
            "quickstep/src/com/android/quickstep/SystemUiProxy.kt"
          )

          for p in "${required_paths[@]}"; do
            if [ ! -e "$p" ]; then
              echo "ERROR: missing required source path: $p" >&2
              exit 1
            fi
            echo "OK: $p"
          done

          if grep -RIn \
            'submit(Callable { provider(impl) }).get()' \
            quickstep \
            --include='*.kt'; then
            echo "ERROR: old TaskbarManagerImplWrapper implementation detected." >&2
            exit 1
          fi

      - name: Adapt widgetpicker resources to standalone app namespace
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Adapting widgetpicker R imports for merged application resources..."

          changed=0

          while IFS= read -r -d '' f; do
            if grep -q \
              'import com\.android\.launcher3\.widgetpicker\.R' \
              "$f"; then

              sed -i \
                's/import com\.android\.launcher3\.widgetpicker\.R/import com.android.launcher3.R/g' \
                "$f"

              changed=$((changed + 1))
              echo "Patched: $f"
            fi
          done < <(
            find modules/widgetpicker/src \
              -type f \
              \( -name '*.kt' -o -name '*.java' \) \
              -print0
          )

          echo "Changed widgetpicker source files: $changed"

          if grep -RIn \
            'import com\.android\.launcher3\.widgetpicker\.R' \
            modules/widgetpicker/src \
            --include='*.kt' \
            --include='*.java'; then

            echo "ERROR: widgetpicker R import still remains." >&2
            exit 1
          fi

          echo "Widgetpicker R namespace adaptation complete."

      - name: Remove stale harness SettingsActivity
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          STALE="src/com/android/launcher3/settings/SettingsActivity.java"

          if [ -f "$STALE" ]; then
            echo "Removing stale harness source: $STALE"
            rm -f "$STALE"
          fi

          test ! -e "$STALE"

      - name: Prepare Smartspacer Gradle modules
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing Smartspacer SDK modules..."

          test -d smartspacer/sdk-core/src/main
          test -d smartspacer/sdk-core/src/main/aidl
          test -d smartspacer/sdk-client/src/main
          test -d smartspacer/sdk-client/soong
          test -s smartspacer/balloon/balloon-1.6.13.aar

          cat > smartspacer/sdk-core/build.gradle <<'EOF'
          plugins {
              id 'com.android.library'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-parcelize'
          }

          android {
              namespace 'com.kieronquinn.app.smartspacer.sdk'
              compileSdkVersion 37
              buildToolsVersion "37.0.0"

              defaultConfig {
                  minSdk 29
                  consumerProguardFiles "consumer-rules.pro"

                  buildConfigField(
                      "String",
                      "SMARTSPACER_PACKAGE_NAME",
                      "\"com.kieronquinn.app.smartspacer\""
                  )
              }

              buildFeatures {
                  aidl true
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main {
                      java.srcDirs = [
                          'src/main/java',
                          'soong'
                      ]
                  }
              }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.19.0"
          }

          tasks.withType(Jar).configureEach {
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
              exclude { details ->
                  details.file.absolutePath.contains("generated") &&
                      details.name == "ParceledListSlice.java"
              }
          }
          EOF

          cat > smartspacer/sdk-client/build.gradle <<'EOF'
          plugins {
              id 'com.android.library'
              id 'org.jetbrains.kotlin.android'
              id 'kotlin-parcelize'
          }

          android {
              namespace 'com.kieronquinn.app.smartspacer.sdk.client'
              compileSdkVersion 37
              buildToolsVersion "37.0.0"

              defaultConfig {
                  minSdk 29
                  consumerProguardFiles "consumer-rules.pro"

                  buildConfigField(
                      "int",
                      "SDK_VERSION",
                      "3"
                  )
              }

              buildFeatures {
                  viewBinding true
                  aidl true
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              sourceSets {
                  main {
                      java.srcDirs = [
                          'src/main/java',
                          'soong'
                      ]
                      res.srcDirs = [
                          'src/main/res'
                      ]
                  }
              }
          }

          dependencies {
              api project(':smartspacer-sdk-core')

              implementation 'androidx.core:core-ktx:1.19.0'
              implementation 'androidx.fragment:fragment-ktx:1.8.9'
              implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
              implementation 'androidx.lifecycle:lifecycle-service:2.10.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'

              implementation files(
                  "${rootProject.projectDir}/smartspacer/balloon/balloon-1.6.13.aar"
              )
          }

          tasks.withType(Jar).configureEach {
              duplicatesStrategy = DuplicatesStrategy.EXCLUDE
          }
          EOF

          echo "Smartspacer Gradle modules created."

      - name: Configure Smartspacer modules
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("settings.gradle")
          s = p.read_text()

          marker = 'rootProject.name = "Launcher3"'

          additions = """
          include ':smartspacer-sdk-core'
          include ':smartspacer-sdk-client'

          project(':smartspacer-sdk-core').projectDir =
              new File(rootDir, 'smartspacer/sdk-core')

          project(':smartspacer-sdk-client').projectDir =
              new File(rootDir, 'smartspacer/sdk-client')
          """

          if "include ':smartspacer-sdk-core'" not in s:
              if marker not in s:
                  raise SystemExit(
                      "Could not find rootProject.name in settings.gradle"
                  )

              s = s.replace(
                  marker,
                  additions + "\n" + marker,
                  1
              )

          p.write_text(s)
          PY

          echo "=== Smartspacer project configuration ==="

          grep -n \
            -E 'smartspacer-sdk-core|smartspacer-sdk-client' \
            settings.gradle

      - name: Add Smartspacer dependency to Launcher3
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text()

          dependency = "    implementation project(':smartspacer-sdk-client')"

          if dependency not in s:
              markers = [
                  "    implementation libs.androidx.core.ktx",
                  "    implementation libs.androidx.annotation",
              ]

              inserted = False

              for marker in markers:
                  if marker in s:
                      s = s.replace(
                          marker,
                          dependency + "\n" + marker,
                          1
                      )
                      inserted = True
                      break

              if not inserted:
                  pos = s.find("dependencies {")
                  if pos < 0:
                      raise SystemExit(
                          "Could not find dependencies block in build.gradle"
                      )

                  pos += len("dependencies {")
                  s = s[:pos] + "\n" + dependency + s[pos:]

          p.write_text(s)
          PY

          grep -n \
            "smartspacer-sdk-client" \
            build.gradle

      - name: Add uwu root resources to main resource graph
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text()

          marker = """            res.srcDirs = [
                'modules/widgetpicker/res',
                'platform_frameworks_libs/frameworks_libs_systemui/dynamiccolors/res',
                'platform_frameworks_libs/settingslib_theme_res/res'
            ]"""

          replacement = """            res.srcDirs = [
                'res',
                'modules/widgetpicker/res',
                'platform_frameworks_libs/frameworks_libs_systemui/dynamiccolors/res',
                'platform_frameworks_libs/settingslib_theme_res/res'
            ]"""

          if marker not in s:
              raise SystemExit(
                  "Could not find main res.srcDirs block in build.gradle"
              )

          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY

          echo "=== Main resource directories ==="
          sed -n '/res.srcDirs = \[/,/^            \]/p' build.gradle | head -20

          test -f res/values/uwu_dimens.xml
          test -f res/xml/uwu_device_profiles.xml
          test -f res/layout/hotseat_page.xml

      - name: Enable Kotlin JVM default compatibility
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("build.gradle")
          s = p.read_text()

          old = """    kotlinOptions {
        jvmTarget = '21'
    }"""

          new = """    kotlinOptions {
        jvmTarget = '21'
        freeCompilerArgs += ['-Xjvm-default=all']
    }"""

          if old in s:
              s = s.replace(old, new, 1)
          elif "-Xjvm-default=all" not in s:
              raise SystemExit(
                  "Could not find root kotlinOptions block."
              )

          p.write_text(s)
          PY

          grep -n \
            -A4 -B1 \
            'kotlinOptions' \
            build.gradle | head -12

      - name: Patch TaskbarManagerImplWrapper for Kotlin 2.4
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          FILE="quickstep/src/com/android/launcher3/taskbar/TaskbarManagerImplWrapper.kt"

          if [ ! -f "$FILE" ]; then
            FILE="$(find quickstep -name 'TaskbarManagerImplWrapper.kt' -print -quit)"
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "ERROR: TaskbarManagerImplWrapper.kt not found." >&2
            exit 1
          fi

          echo "Patching: $FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          old = """    @VisibleForTesting
    override fun <T> getFromImplSync(provider: (TaskbarManagerImpl) -> T): T =
        getTaskbarUiThread().submit(Callable { provider(impl) }).get()
          """

          new = """    @VisibleForTesting
    override fun <T> getFromImplSync(
        provider: (TaskbarManagerImpl) -> T
    ): T {
        val future = FutureTask(Callable<T> { provider(impl) })
        getTaskbarUiThread().execute(future)
        return future.get()
    }
          """

          if old not in s:
              if "FutureTask(Callable<T>" in s:
                  print("Taskbar patch already present.")
                  sys.exit(0)

              print(
                  "ERROR: expected old getFromImplSync implementation not found.",
                  file=sys.stderr
              )
              sys.exit(1)

          s = s.replace(old, new, 1)

          if "import java.util.concurrent.FutureTask" not in s:
              needle = "import java.util.concurrent.Callable"
              if needle not in s:
                  raise SystemExit(
                      "Could not find java.util.concurrent.Callable import."
                  )

              s = s.replace(
                  needle,
                  needle + "\nimport java.util.concurrent.FutureTask",
                  1
              )

          p.write_text(s)
          PY

          if grep -n \
            'submit(Callable { provider(impl) }).get()' \
            "$FILE"; then

            echo "ERROR: old submit implementation remains." >&2
            exit 1
          fi

          grep -n \
            -A8 \
            'getFromImplSync' \
            "$FILE"

      - name: Add SystemUiProxy compatibility shim
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          SHIM="quickstep/src/com/android/quickstep/SystemUiProxyCompat.kt"

          cat > "$SHIM" <<'EOF'
          /* Standalone compatibility shim for newer uwuAOSP SystemUI proxy calls. */
          package com.android.quickstep

          import com.android.systemui.shared.recents.ISystemUiProxy

          fun ISystemUiProxy.onNavHandleDoubleTap(
              displayId: Int,
              taskId: Int,
          ) {
              try {
                  javaClass.getMethod(
                      "onNavHandleDoubleTap",
                      Int::class.javaPrimitiveType!!,
                      Int::class.javaPrimitiveType!!,
                  ).invoke(this, displayId, taskId)
              } catch (_: NoSuchMethodException) {
                  // Older SystemUISharedLib: no-op.
              }
          }
          EOF

          test -s "$SHIM"

          echo "Created compatibility shim:"
          cat "$SHIM"

      - name: Fix Android private resources
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Mapping AOSP private resources to standalone equivalents..."

          find . \
            -type f \
            -name "*.xml" \
            -not -path "./.git/*" \
            -print0 |
          while IFS= read -r -d '' f; do

            sed -i \
              's#@androidprv:color/shade_panel_bg#@color/shade_panel_bg#g' \
              "$f"

            sed -i \
              's#@androidprv:color/shade_panel_fg#@color/shade_panel_fg#g' \
              "$f"

            sed -i \
              's#@androidprv:color/shade_panel_scrim_color#@color/shade_panel_scrim_color#g' \
              "$f"

            sed -i \
              's#?androidprv:attr/colorAccentPrimary#?android:attr/colorAccent#g' \
              "$f"

            sed -i \
              's#?androidprv:attr/textColorOnAccent#?android:attr/textColorPrimary#g' \
              "$f"

          done

          cat > res/values/standalone_private_resources.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="shade_panel_bg">#523C4043</color>
              <color name="shade_panel_fg">#E6FFFFFF</color>
              <color name="shade_panel_scrim_color">#99000000</color>
          </resources>
          EOF

          echo
          echo "=== Remaining private resource references ==="

          grep -RIn \
            'androidprv:' \
            . \
            --include='*.xml' \
            --exclude-dir=.git || true

      - name: Fix Android 17 main manifest for AGP 9
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("AndroidManifest.xml")
          s = p.read_text()

          old = (
              '<uses-sdk android:targetSdkVersion="33" '
              'android:minSdkVersion="30"'
          )

          if old in s:
              s = s.replace(
                  old,
                  '<uses-sdk',
                  1
              )

          p.write_text(s)
          PY

          echo "=== Main manifest ==="
          grep -n "uses-sdk" AndroidManifest.xml || true

      - name: Remove unsupported AAPT feature flags
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing standalone-build-incompatible android:featureFlag attributes..."

          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = 0
          removed = 0

          for p in Path(".").rglob("*.xml"):
              if ".git" in p.parts:
                  continue

              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue

              new, n = re.subn(
                  r'\s+android:featureFlag="[^"]*"',
                  '',
                  s
              )

              if n:
                  p.write_text(new)
                  changed += 1
                  removed += n
                  print(f"{p}: removed {n}")

          print(
              f"Changed XML files: {changed}; "
              f"removed featureFlag attributes: {removed}"
          )
          PY

          if grep -RIn \
            'android:featureFlag=' \
            . \
            --include='*.xml' \
            --exclude-dir=.git; then

            echo "ERROR: android:featureFlag remains." >&2
            exit 1
          fi

          echo "No android:featureFlag attributes remain."

      - name: Fix Gradle repositories
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            "s#https://maven.aliyun.com/repository/google#OFFICIAL_GOOGLE_REPO#g" \
            settings.gradle

          sed -i \
            "s#https://maven.aliyun.com/repository/central#OFFICIAL_CENTRAL_REPO#g" \
            settings.gradle

          sed -i \
            "s#https://maven.aliyun.com/repository/gradle-plugin#OFFICIAL_GRADLE_PLUGIN_REPO#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_GOOGLE_REPO' }#google()#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_CENTRAL_REPO' }#mavenCentral()#g" \
            settings.gradle

          sed -i \
            "s#maven { url 'OFFICIAL_GRADLE_PLUGIN_REPO' }#gradlePluginPortal()#g" \
            settings.gradle

          echo "=== Gradle repositories ==="
          cat settings.gradle

          echo
          echo "=== Remaining Aliyun references ==="

          if grep -RIn \
            "maven.aliyun.com/repository" \
            . \
            --exclude-dir=.git \
            --exclude='*.jar' \
            --exclude='*.aar'; then

            echo "ERROR: Aliyun Maven repository remains." >&2
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Android SDK
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          command -v sdkmanager
          sdkmanager --version

          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

          test -d "$ANDROID_SDK_ROOT/platforms/android-37.0"
          test -d "$ANDROID_SDK_ROOT/build-tools/37.0.0"

          if [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s \
              "$ANDROID_SDK_ROOT/platforms/android-37.0" \
              "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

          sed -i \
            's/compileSdk[[:space:]]*36/compileSdk 37/g' \
            build.gradle

          sed -i \
            's/buildToolsVersion[[:space:]]*"36\.0\.0"/buildToolsVersion "37.0.0"/g' \
            build.gradle

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          EOF

          echo
          echo "=== Android build configuration ==="

          grep -nE \
            'compileSdk|buildToolsVersion' \
            build.gradle

          echo
          cat local.properties

          echo
          echo "=== Installed Android build tools ==="
          ls -1 "$ANDROID_SDK_ROOT/build-tools"

      - name: Generate debug keystore
        shell: bash
        run: |
          set -euo pipefail

          DEBUG_DIR="$HOME/.config/.android"
          DEBUG_KEYSTORE="$DEBUG_DIR/debug.keystore"

          mkdir -p "$DEBUG_DIR"

          if [ ! -s "$DEBUG_KEYSTORE" ]; then
            echo "Generating debug keystore..."

            keytool \
              -genkeypair \
              -v \
              -keystore "$DEBUG_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          test -s "$DEBUG_KEYSTORE"

          ls -lh "$DEBUG_KEYSTORE"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
          cache-read-only: false

      - name: Generate BuildConfig
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          chmod +x tools/buildconfig.sh

          mkdir -p generated-src/com/android/launcher3

          tools/buildconfig.sh \
            --pkg com.android.launcher3 \
            --appId com.android.launcher3 \
            > generated-src/com/android/launcher3/BuildConfig.java

          sed -n '1,120p' \
            generated-src/com/android/launcher3/BuildConfig.java

      - name: Check framework prebuilts
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "framework-android17.jar"
            "SystemUI.jar"
            "SystemUISharedLib.jar"
            "WindowManager-Shell-shared-AOSP.jar"
            "com_android_launcher3_flags_lib.jar"
            "com_android_systemui_flags_lib.jar"
            "com_android_systemui_shared_flags_lib.jar"
            "com_android_window_flags_lib.jar"
            "com_android_wm_shell_flags_lib.jar"
          )

          for f in "${required[@]}"; do
            test -s "prebuilts/framework/$f" || {
              echo "Missing/empty prebuilt: $f" >&2
              exit 1
            }
          done

          ls -lh prebuilts/framework/

      - name: Verify Smartspacer modules
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          test -f smartspacer/sdk-core/build.gradle
          test -f smartspacer/sdk-client/build.gradle
          test -f smartspacer/sdk-core/src/main/AndroidManifest.xml
          test -f smartspacer/sdk-client/src/main/AndroidManifest.xml
          test -d smartspacer/sdk-core/src/main/aidl
          test -d smartspacer/sdk-core/soong
          test -d smartspacer/sdk-client/soong
          test -s smartspacer/balloon/balloon-1.6.13.aar

          echo "=== Smartspacer modules ==="

          grep -n \
            -E 'compileSdkVersion|buildToolsVersion|kotlin-parcelize|sourceSets|dependencies|implementation|api' \
            smartspacer/sdk-core/build.gradle \
            smartspacer/sdk-client/build.gradle

      - name: Final compatibility audit
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Final resource audit ==="

          for f in \
            res/values/uwu_dimens.xml \
            res/xml/uwu_device_profiles.xml \
            res/layout/hotseat_page.xml \
            res/values/strings.xml; do
            test -s "$f" || {
              echo "Missing resource: $f" >&2
              exit 1
            }
          done

          echo
          echo "=== QuickStep compatibility audit ==="

          test -s \
            quickstep/src/com/android/quickstep/SystemUiProxyCompat.kt

          if grep -RIn \
            'onNavHandleDoubleTap' \
            quickstep/src/com/android/quickstep/SystemUiProxy.kt; then
            echo "uwuAOSP SystemUiProxy call present."
          else
            echo "ERROR: expected onNavHandleDoubleTap call not found." >&2
            exit 1
          fi

          echo
          echo "=== Taskbar compatibility audit ==="

          if grep -RIn \
            'submit(Callable { provider(impl) }).get()' \
            quickstep \
            --include='*.kt'; then
            echo "ERROR: incompatible Taskbar implementation remains." >&2
            exit 1
          fi

          grep -RIn \
            'FutureTask(Callable<T>' \
            quickstep \
            --include='*.kt'

          echo
          echo "=== Feature flag audit ==="

          if grep -RIn \
            'android:featureFlag=' \
            . \
            --include='*.xml' \
            --exclude-dir=.git; then
            echo "ERROR: android:featureFlag remains." >&2
            exit 1
          fi

          echo
          echo "=== Private resource audit ==="

          if grep -RIn \
            'androidprv:' \
            . \
            --include='*.xml' \
            --exclude-dir=.git; then
            echo "ERROR: androidprv resource references remain." >&2
            exit 1
          fi

          echo
          echo "Final compatibility audit passed."

      - name: Verify Gradle configuration
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Gradle configuration before full build..."

          gradle \
            --no-daemon \
            --stacktrace \
            help

      - name: Build Launcher3QuickStep
        working-directory: launcher3-build
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
        run: |
          set -euo pipefail

          case "$BUILD_TYPE" in
            Debug)
              TASK="assembleWithquickstepDebug"
              ;;
            Release)
              TASK="assembleWithquickstepRelease"
              ;;
            *)
              echo "Unsupported build type: $BUILD_TYPE" >&2
              exit 2
              ;;
          esac

          echo "Building: $TASK"

          gradle \
            --no-daemon \
            --rerun-tasks \
            --stacktrace \
            --warning-mode all \
            "$TASK"

      - name: Show APKs
        working-directory: launcher3-build
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APK files ==="

          find build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(
            find build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-${{ inputs.build_type || 'Release' }}-${{ github.run_number }}
          path: |
            launcher3-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uwuAOSP-Launcher3QuickStep-diagnostics-${{ github.run_number }}
          path: |
            launcher3-build/build/reports/**
            launcher3-build/build/outputs/logs/**
            launcher3-build/build/outputs/mapping/**
          if-no-files-found: ignore
          retention-days: 7